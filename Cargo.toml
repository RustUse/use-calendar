[workspace]
members = [
    "crates/use-calendar",
    "crates/use-date",
    "crates/use-weekday",
    "crates/use-month",
    "crates/use-year",
    "crates/use-quarter",
    "crates/use-date-range",
    "crates/use-business-day",
    "crates/use-recurrence",
]
resolver = "2"

[workspace.package]
authors = ["RustUse Contributors"]
edition = "2024"
homepage = "https://rustuse.org"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/RustUse/use-calendar"
rust-version = "1.95.0"
version = "0.0.1"

[workspace.dependencies]
use-business-day = { version = "0.0.1", path = "crates/use-business-day" }
use-calendar = { version = "0.0.1", path = "crates/use-calendar" }
use-date = { version = "0.0.1", path = "crates/use-date" }
use-date-range = { version = "0.0.1", path = "crates/use-date-range" }
use-month = { version = "0.0.1", path = "crates/use-month" }
use-quarter = { version = "0.0.1", path = "crates/use-quarter" }
use-recurrence = { version = "0.0.1", path = "crates/use-recurrence" }
use-weekday = { version = "0.0.1", path = "crates/use-weekday" }
use-year = { version = "0.0.1", path = "crates/use-year" }

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.metadata.rustuse.release]
publish = false
versioning = "lockstep-0.x"
first-publish-candidates = [
    "use-date",
    "use-weekday",
    "use-month",
    "use-year",
    "use-quarter",
    "use-date-range",
    "use-business-day",
    "use-recurrence",
    "use-calendar",
]
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
